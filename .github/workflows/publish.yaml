name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Attach a protected GitHub Environment so a human must approve before anything reaches pub.dev.
    # Configure required reviewers under Settings > Environments > pub-dev. Until that protection is
    # set the environment is unprotected (no gate), so add reviewers to make this effective.
    environment: pub-dev
    permissions:
      id-token: write # required for OIDC auth with pub.dev

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        run: |
          EXPECTED="v$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$EXPECTED" != "$GITHUB_REF_NAME" ]; then
            echo "Refusing to publish: tag $GITHUB_REF_NAME does not match pubspec version $EXPECTED"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec version."

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Publish (dry run)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
